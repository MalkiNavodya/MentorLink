<div class="login-page">

  <div class="login-card">

    <div class="logo">
      MentorLink
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Sign in to continue your learning journey.
    </p>

    <form (ngSubmit)="login()">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          autocomplete="email"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          autocomplete="current-password"
        >

      </div>

      <div
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </div>

      <div
        class="success-message"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
      >
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <p class="register-link">
      Don't have an account?
      <a routerLink="/register">
        Create an account
      </a>
    </p>

  </div>

</div>
